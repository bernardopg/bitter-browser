name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use private reporting in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, Linux distribution, desktop and install method
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (remove personal information and secrets)
      render: shell
