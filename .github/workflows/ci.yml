name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Rust checks and coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev dbus xvfb xauth xdotool openssl
      - name: Install Rust components
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Install audit and coverage tools
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit,cargo-llvm-cov
      - name: Audit dependencies
        run: cargo audit
      - name: Test and collect coverage
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: scripts/headless-session.sh -- cargo llvm-cov --workspace --all-targets --locked --lcov --output-path lcov.info
      - name: Test native preferences
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: scripts/headless-session.sh -- cargo test -p bitter-ui --locked settings_widgets_save_restore_and_report_errors -- --ignored
      - name: Test native sidebar accessibility
        env:
          GTK_A11Y: test
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: scripts/headless-session.sh -- cargo test -p bitter-ui --locked tab_names_and_loading_state_follow_the_page
      - name: Smoke test browsing and session recovery
        run: |
          cargo build -p bitter-ui --locked
          scripts/headless-session.sh --screen 1440x1000x24 -- timeout 180s python3 scripts/daily-smoke.py target/debug/bitter-ui
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  flatpak-sources:
    name: Flatpak sources
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check vendored Cargo sources and release versions
        run: |
          python3 scripts/check-flatpak-sources.py
          python3 scripts/check-version.py
