name: Release
# Runs when a signed vX.Y.Z tag is pushed. The jobs run in a chain and each one
# needs the previous one to succeed:
#   check -> packages (build and test every format) -> publish (GitHub release)
#   -> verify (install the published release on each distribution) -> aur
# The AUR job is aur.yml, which also republishes an existing release by hand.
# Nothing is published before every package is built and tested, and the AUR
# is updated only after the published release installs everywhere.
# See docs/distribution.md and docs/ci-release.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  # Never stop a release halfway through publishing.
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
  APP_ID: br.com.bebitterbebetter.browser.Bitter
jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main and every version file agrees
        id: tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/check-version.py "$TAG"
          python3 scripts/check-flatpak-sources.py
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  packages:
    name: Packages
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ github.sha }}
      sign: true
    secrets:
      PACMAN_GPG_PRIVATE_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
      PACMAN_GPG_FINGERPRINT: ${{ secrets.PACMAN_GPG_FINGERPRINT }}

  publish:
    name: Publish the GitHub release
    needs: [check, packages]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect the release assets
        run: |
          mkdir dist
          cp artifacts/source/*.tar.gz dist/
          cp artifacts/linux/*.deb artifacts/linux/*.tar.xz dist/
          cp artifacts/rpm/*.rpm dist/
          cp artifacts/flatpak/*.flatpak dist/
          # Native Arch package and the signed pacman repository (flat assets).
          cp artifacts/arch/repo/* dist/
          cp artifacts/arch/pkg/bitter-browser-bin-*.pkg.tar.zst dist/
          # The recipe that builds this release from the source archive, as before.
          cp artifacts/arch/aur/bitter-browser/PKGBUILD dist/PKGBUILD
          cp scripts/install.sh dist/install.sh
          cp packaging/arch/bitter-browser-packages.asc dist/
          ls -la dist
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/bitter-browser-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write checksums
        run: |
          cd dist
          sha256sum -- * > "bitter-browser-$VERSION-sha256.txt"
          cat "bitter-browser-$VERSION-sha256.txt"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - "$VERSION" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no notes for {version}")
          print(match.group(1).strip())
          print()
          print(open("packaging/release-install-notes.md", encoding="utf-8").read().replace("@VERSION@", version))
          PY
          gh release create "$TAG" dist/* --verify-tag --title "Bitter Browser $VERSION" \
            --notes-file notes.md
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir published
          cd published
          gh release download "$TAG"
          sha256sum -c "bitter-browser-$VERSION-sha256.txt"
          for file in *; do
            gh attestation verify "$file" --repo "$GH_REPO" >/dev/null
          done
          # The PKGBUILD must fetch exactly the archive its checksum describes.
          source_url=$(bash -c 'source ./PKGBUILD && printf "%s" "${source[0]}"')
          expected=$(bash -c 'source ./PKGBUILD && printf "%s" "${sha256sums[0]}"')
          curl -fsSL "$source_url" -o source.tar.gz
          echo "$expected  source.tar.gz" | sha256sum -c

  verify:
    name: Install the published release on ${{ matrix.image }} (${{ matrix.method }})
    needs: [check, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'debian:trixie', method: deb}
          - {image: 'ubuntu:26.04', method: deb}
          - {image: 'fedora:44', method: rpm}
          - {image: 'archlinux:latest', method: pacman}
          - {image: 'archlinux:latest', method: pacman-repo}
          - {image: 'opensuse/tumbleweed', method: tarball}
    container:
      image: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      METHOD: ${{ matrix.method }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install with the published installer or repository
        run: sh packaging/linux/verify-published.sh "$METHOD" "$VERSION"

  aur:
    name: AUR
    needs: [check, verify]
    permissions:
      contents: read
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
