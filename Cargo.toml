[workspace]
members = [
    "crates/bitter-core",
    "crates/bitter-adblock",
    "crates/bitter-ui",
    "crates/bitter-cli"
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Bitter Browser Contributors"]
license = "MPL-2.0"

[workspace.dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
webkit6 = { version = "0.6", features = ["v2_44"] }
rusqlite = { version = "0.43", features = ["bundled", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
toml_edit = "0.25"
url = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
